version: "0.1"

credentials:
  - system: string              # required; ref to systems[].name (or alias) in systems.yml
    purpose: string             # required; one-sentence description of what the bot does with this credential
    interface: string           # required; e.g. "Microsoft Graph API (msgraph)" | "SAP GUI (WinGUI scripting)" | "REST API (HTTPS)" | "DHL.ITS.AppIntegration.FTP"
    auth_type: string           # required; e.g. "OAuth2 client-credentials (app registration)" | "SAP username + password" | "no-auth" | "SSH key + SFTP username/password"
    storage: orchestrator-asset|no-auth|config-key|windows-credential|robot-registration
                                # orchestrator-asset  — credential asset in UiPath Orchestrator (preferred for secrets)
                                # no-auth             — publicly accessible, no credential required
                                # config-key          — non-secret routing value in Config_Dev.xlsx only
                                # windows-credential  — Windows Credential Manager (local dev only)
                                # robot-registration  — managed by UiPath platform, not in Config_Dev.xlsx
    permissions_required:       # list of access rights / roles needed for this credential
      - string
    entries:                    # one entry per Config_Dev.xlsx key or Orchestrator asset reference
      - key: string             # required; PascalCase key name as used in Config_Dev.xlsx and in code
        config_key: string      # required; exact key string in Config_Dev.xlsx Settings sheet (usually = key)
        description: string     # required; what this value represents
        example: string         # required; non-secret representative value
        secret: boolean         # required; true = must live in Orchestrator asset only, never in Config_Dev.xlsx
    notes:                      # optional; constraints, consent requirements, known limitations
      - string
